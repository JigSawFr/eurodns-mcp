name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege by default. A job that needs more says so itself, and nothing here needs
# write access to the repository.
permissions:
  contents: read

# Third-party actions are pinned to a commit rather than a tag: a tag can be moved to point
# at different code without any change here. The version each pin corresponds to is in the
# trailing comment, and Dependabot keeps both in step.

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Scripts stay enabled on purpose: this exercises the `prepare` script that makes
      # `npx github:JigSawFr/eurodns-mcp` work. It rebuilds before the explicit steps below,
      # which costs a few seconds and is the only place that path is covered.
      - run: npm ci
      - run: npm run gen
      - name: Generated sources must be up to date
        run: git diff --exit-code -- src/generated
      # Covers the tests as well as the sources. The build configuration excludes tests from
      # its output, so without this they are only ever stripped of types, never checked —
      # and a test can then keep asserting against a shape production no longer has.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Runs the suite and enforces the coverage floors in one pass — coverage has to run
      # the tests anyway, so a separate `npm test` step would only run them twice.
      - run: npm run coverage

  # release-please reads Conventional Commit subjects. A non-conforming subject produces no
  # release and says nothing about it, so the convention is checked before it reaches main.
  # With squash merges the PR title becomes the commit subject, which is why it is checked
  # here rather than on individual commits.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Dockerfile is only ever exercised here. Build for amd64 alone — the release workflow
  # does the multi-arch build, and doubling it on every pull request buys nothing.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: eurodns-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Refuses to listen on 0.0.0.0 without authentication
        run: |
          set +e
          output=$(docker run --rm -e EURODNS_APP_ID=x -e EURODNS_API_KEY=y eurodns-mcp:ci 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 78 ]; then echo "::error::expected exit 78, got $code"; exit 1; fi
          echo "$output" | grep -q 'EURODNS_MCP_AUTH' \
            || { echo "::error::the refusal should name the variable to set"; exit 1; }

      - name: Start the container
        run: |
          TOKEN=$(openssl rand -hex 32)
          METRICS_TOKEN=$(openssl rand -hex 32)
          # Without the mask, the value is printed in plain text in every later step's
          # env block. It is a throwaway secret for a container this job destroys, and this
          # repository is private today — but it is meant to be published, and a habit that
          # only holds while nobody is looking is not one.
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$METRICS_TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "METRICS_TOKEN=$METRICS_TOKEN" >> "$GITHUB_ENV"
          docker volume create ci-audit
          # The runtime hardening the compose file applies, asserted here rather than
          # trusted: a read-only root filesystem with no capabilities and no privilege
          # escalation is what the deployment documentation tells operators to run.
          docker run -d --name mcp -p 3000:3000 \
            --read-only --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e EURODNS_APP_ID=test-app-id \
            -e EURODNS_API_KEY=test-api-key \
            -e EURODNS_MCP_AUTH=token \
            -e EURODNS_MCP_TOKEN="$TOKEN" \
            -e EURODNS_AUDIT_DESTINATION=file \
            -e EURODNS_AUDIT_FILE=/data/audit.jsonl \
            -e EURODNS_AUDIT_QUERY=all \
            -e EURODNS_METRICS_TOKEN="$METRICS_TOKEN" \
            -e EURODNS_RATE_LIMIT=50 \
            -e EURODNS_RATE_LIMIT_WINDOW_MS=600000 \
            -v ci-audit:/data \
            eurodns-mcp:ci

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS localhost:3000/healthz >/dev/null 2>&1; then
              curl -fsS localhost:3000/healthz; echo; exit 0
            fi
            sleep 1
          done
          echo "::error::the container never became healthy"
          docker logs mcp
          exit 1

      # Written with `if` rather than `cmd && { fail; }`: under `set -e` a grep that finds
      # nothing would end the step as a failure, which is the passing case here.
      - name: Health check leaks nothing about the build
        run: |
          body=$(curl -fsS localhost:3000/healthz)
          echo "$body"
          if echo "$body" | grep -q 'version'; then
            echo "::error::/healthz must not name the version"; exit 1
          fi
          if curl -fsS -D - -o /dev/null localhost:3000/healthz | grep -qi '^x-powered-by'; then
            echo "::error::the framework banner should be off"; exit 1
          fi

      # Reads either shape of answer. The 2026-07-28 path replies with a JSON body; the
      # 2025-era path replies with a single SSE frame, because v2 builds that transport
      # without enableJsonResponse. Both are valid streamable HTTP, so the assertions below
      # must not care which one they got.
      - name: Install a response reader
        run: |
          cat > /tmp/mcp-read.py <<'PY'
          import json, sys
          raw = sys.stdin.read()
          frame = next((l[6:] for l in raw.splitlines() if l.startswith('data: ')), None)
          doc = json.loads(frame if frame is not None else raw)
          if 'error' in doc:
              print('ERROR', doc['error'].get('code'), doc['error'].get('message', ''), file=sys.stderr)
              raise SystemExit(1)
          print(json.dumps(doc.get('result', {})))
          PY

      - name: Reject an unauthenticated call
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/mcp \
            -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          [ "$code" = "401" ] || { echo "::error::expected 401, got $code"; exit 1; }

      - name: List tools as a 2025-era client
        run: |
          count=$(curl -fsS -X POST localhost:3000/mcp \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | python3 /tmp/mcp-read.py \
            | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["tools"]))')
          echo "tools: $count"
          [ "$count" -ge 80 ] || { echo "::error::expected the full tool surface, got $count"; exit 1; }

      # The whole point of the migration: the new revision served natively, on the same
      # endpoint, to a client that never sends `initialize`. A modern request is one carrying
      # the _meta envelope claim and the matching headers — a header without the claim is
      # answered -32602, so this also proves the envelope is being read.
      - name: Serve the 2026-07-28 revision natively
        run: |
          modern() {
            curl -fsS -X POST localhost:3000/mcp \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -H 'MCP-Protocol-Version: 2026-07-28' \
              -H "Mcp-Method: $1" \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$1\",\"params\":{\"_meta\":{\"io.modelcontextprotocol/protocolVersion\":\"2026-07-28\",\"io.modelcontextprotocol/clientInfo\":{\"name\":\"ci\",\"version\":\"0\"},\"io.modelcontextprotocol/clientCapabilities\":{}}}}" \
              | python3 /tmp/mcp-read.py
          }

          discover=$(modern 'server/discover')
          echo "$discover" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "resultType" in d and "supportedVersions" in d, d.keys(); print("discover:", ", ".join(sorted(d)))'

          count=$(modern 'tools/list' | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["tools"]))')
          echo "modern tools: $count"
          [ "$count" -ge 80 ] || { echo "::error::the modern path returned $count tools"; exit 1; }

      # Proves the audit log survives on the volume: the first query writes its own line and
      # sees nothing, the second reads that line back. This is also the only tool that needs
      # no upstream call, so it works without real EuroDNS credentials.
      - name: Audit log persists across calls
        run: |
          query() {
            curl -fsS -X POST localhost:3000/mcp \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"eurodns_audit_query","arguments":{}}}' \
              | python3 /tmp/mcp-read.py \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["structuredContent"]["returned"])'
          }
          first=$(query); second=$(query)
          echo "returned: first=$first second=$second"
          [ "$first" = "0" ] || { echo "::error::the log should start empty, got $first"; exit 1; }
          [ "$second" = "1" ] || { echo "::error::the first call should have been recorded, got $second"; exit 1; }

      - name: Audit log is not world-readable
        run: |
          mode=$(docker exec mcp stat -c '%a' /data/audit.jsonl)
          echo "mode: $mode"
          [ "$mode" = "600" ] || { echo "::error::expected mode 600, got $mode"; exit 1; }

      # The chain has to survive the transport rebuilding its server on every request, which
      # is exactly what a unit test cannot show. Each of the calls above went through its own
      # server instance; if the chain restarted with them, more than one line would carry a
      # null `prev`.
      - name: The hash chain spans requests, and a forged line is caught
        run: |
          docker exec mcp node -e '
            const fs = require("fs"), crypto = require("crypto");
            const lines = fs.readFileSync("/data/audit.jsonl", "utf8").split("\n").filter(Boolean);
            const parsed = lines.map((l) => JSON.parse(l));
            const genesis = parsed.filter((e) => e.prev === null).length;
            if (genesis !== 1) throw new Error(`expected one chain start, got ${genesis}`);
            parsed.forEach((e, i) => {
              if (e.seq !== i + 1) throw new Error(`seq ${e.seq} at position ${i + 1}`);
              if (i === 0) return;
              const want = crypto.createHash("sha256").update(lines[i - 1], "utf8").digest("hex");
              if (e.prev !== want) throw new Error(`chain broken at seq ${e.seq}`);
            });
            console.log(`chain intact over ${lines.length} lines`);
          '

      - name: Metrics need their own token, and carry no domain
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/metrics)
          [ "$code" = "401" ] || { echo "::error::unauthenticated /metrics gave $code"; exit 1; }

          # The MCP credential must not open the metrics endpoint, nor the reverse.
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/metrics \
            -H "Authorization: Bearer $TOKEN")
          [ "$code" = "401" ] || { echo "::error::the MCP token opened /metrics ($code)"; exit 1; }

          body=$(curl -fsS localhost:3000/metrics -H "Authorization: Bearer $METRICS_TOKEN")
          echo "$body" | grep -E 'eurodns_mcp_tool_calls_total|eurodns_mcp_tools_registered'

          # The version is read from package.json at runtime, and the container is where that
          # path is most likely to break: it is the only layout where the build and the
          # manifest are copied in separately. This metric reported 0.1.0 for two releases.
          want=$(node -p "require('./package.json').version")
          echo "$body" | grep -q "eurodns_mcp_build_info{version=\"$want\"} 1" \
            || { echo "::error::build_info does not report $want"; echo "$body" | grep build_info; exit 1; }
          echo "build_info reports $want"
          if echo "$body" | grep -qi 'test-api-key\|static-token'; then
            echo "::error::/metrics must not carry a credential or an actor"; exit 1
          fi

      # Deliberately last: it exhausts the window for the rest of the job. The probe is an
      # unauthenticated POST, which is the point — a request that never reaches the auth
      # middleware still counts, so this proves the limiter sits in front of it rather than
      # behind. The container runs with a limit of 50 over a ten-minute window, long enough
      # that the window cannot roll over mid-step and hide a failure.
      - name: The rate limit trips on /mcp, and only there
        run: |
          seen429=0
          for i in $(seq 1 120); do
            code=$(curl -s -o /tmp/rl-body -w '%{http_code}' -X POST localhost:3000/mcp \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
            if [ "$code" = "429" ]; then seen429=$i; break; fi
            [ "$code" = "401" ] || { echo "::error::request $i answered $code, expected 401 or 429"; exit 1; }
          done
          [ "$seen429" != "0" ] || { echo "::error::120 unauthenticated requests never hit the limit"; exit 1; }
          echo "limited after $seen429 requests"

          # A bare HTML 429 would leave an MCP client with nothing to parse.
          cat /tmp/rl-body; echo
          python3 -c 'import json,sys; d=json.load(open("/tmp/rl-body")); assert d["jsonrpc"]=="2.0" and d["error"]["code"]==-32000, d'

          # The probes that machines run must survive a flood on the endpoint next door.
          curl -fsS localhost:3000/healthz >/dev/null \
            || { echo "::error::/healthz was caught by the limiter"; exit 1; }
          curl -fsS localhost:3000/metrics -H "Authorization: Bearer $METRICS_TOKEN" >/dev/null \
            || { echo "::error::/metrics was caught by the limiter"; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs mcp || true

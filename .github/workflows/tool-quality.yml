name: Tool definition quality

# The registries that list this server score every tool definition — Glama with the TDQS
# rubric — and the score is a first impression a model and a person both read before they
# try a single call. Glama publishes the reference implementation as `mcp-tdqs`, and this
# runs its linter: the stages of the pipeline that need no model — the contextual signals an
# evaluator is handed, the hard gates (no description, a description that is the name), the
# shadow prefilter and the checklist the specification ranks highest — on the listing a
# registry sees and on the full surface. The reports go in the job summary, the raw
# `tools/list` of both deployments and the JSON reports in an artifact.
#
# `--fail-on error`: the gates fail the run. The warnings do not, and one is expected — the
# shadow prefilter pairs any tool with any materially cheaper sibling across the whole
# server, and only the coherence evaluation, a model call, can say whether the purposes
# overlap. The full `tdqs score` is that model call; it needs a key, costs money on every
# push and gives a different number to the same text on two runs, so it is not run here.
# The dimension scores stay the registry's to give, and the README badge shows them.
#
# This runs on pull requests, unlike spec-drift.yml and link-check.yml, because it depends
# on nothing outside the repository: no network, no key, no third party that could make an
# unrelated pull request intermittently red. The prose itself is held to the rubric's shape
# by `tests/descriptions.test.ts` in the CI workflow; this is the measurement, not the rule.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      # Scripts stay enabled: `prepare` builds `dist/`, which the last check spawns.
      - run: npm ci

      # Writes the `tools/list` of both deployments to tdqs/, then lints each. This is the
      # gate: a hard-gate finding exits 1 and fails the job.
      - name: Lint the tool definitions
        run: npm run tdqs

      # The same reports, rendered for a reader and kept as JSON. `--fail-on never`: the
      # gate above has already spoken, and a report must not hide the one that failed.
      - name: Report
        if: always()
        run: |
          for deployment in default everything; do
            npx tdqs lint --file "tdqs/$deployment.json" --server-name eurodns-mcp \
              --format markdown --fail-on never >> "$GITHUB_STEP_SUMMARY"
            npx tdqs lint --file "tdqs/$deployment.json" --server-name eurodns-mcp \
              --format json --fail-on never --output "tdqs/$deployment.lint.json"
          done

      # What a marketplace gets when it spawns the published command with no environment at
      # all: the stdio server starts without credentials to be listed, and the linter reads
      # that listing over the real transport. The CI workflow's docker job covers HTTP; this
      # is the only place the credential-less stdio path meets a real client.
      - name: Lint the listing a marketplace spawns
        run: npx tdqs lint --command "node dist/index.js" --server-name eurodns-mcp --fail-on error

      # What a model actually reads, for both deployments, plus the reports. Two of these
      # from two commits show a change to the surface more plainly than the source diff.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tool-catalogue
          path: tdqs/
          retention-days: 30

name: Release Please

# Accumulates a release PR from Conventional Commit subjects. Merging that PR bumps the
# version, writes CHANGELOG.md, tags, and publishes a GitHub Release — and then calls the
# image, npm and MCP registry workflows directly.
#
# Calling them is not a stylistic choice. The Release is created with the default GITHUB_TOKEN,
# and GitHub raises no workflow run from an event that token created, so a workflow listening
# for `release: published` never starts. Chaining on this job's own output is the fix that
# needs no personal access token.
#
# The failure mode to know about is silent: a commit whose subject does not follow the
# convention contributes nothing, and no release appears. The PR-title check in ci.yml
# exists to catch that before it reaches main.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Granted here rather than at the top of the file: the release job needs to write
    # contents and pull requests, this one needs to write packages, and neither should
    # carry the other's rights. A called workflow cannot hold more than its caller.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-image.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Same argument as above, and the same reason this is chained rather than listening for
    # `release: published`. No `packages: write`: this job publishes to npm, not to ghcr, and
    # `id-token: write` is what trusted publishing authenticates with — there is no token.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-npm.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  publish-registry:
    # After npm, not beside it: the registry entry names an npm package version, and
    # advertising one npm has not accepted would point every client at something they cannot
    # install. A failed npm publish therefore leaves the registry untouched.
    needs: [release-please, publish-npm]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-registry.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

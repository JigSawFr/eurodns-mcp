name: Publish image

# Called by release-please.yml once it has cut a release, and runnable by hand for a tag
# that was missed. Nothing here needs a secret: ghcr.io accepts the workflow's own
# GITHUB_TOKEN.
#
# It deliberately does NOT trigger on `release: published`, which is the obvious choice and
# the one that cannot work: release-please creates the Release with the default GITHUB_TOKEN,
# and GitHub does not start workflow runs from events raised by that token. The release for
# v0.2.0 published with no image because of exactly that.

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to build, for example v0.2.0.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Git tag to build, for example v0.2.0. A non-prerelease tag also takes `latest`,
          so dispatching an older one moves `latest` backwards.
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Both are required to attach a build provenance attestation to the pushed digest.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}

      # arm64 covers Apple Silicon workstations and ARM instances; amd64 covers the hosts.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }}
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The server handles DNS credentials; a verifiable link from image to source is
      # proportionate and costs one step.
      #
      # Gated on visibility for the same reason as the CodeQL workflow: the attestation API
      # answers "Feature not available for user-owned private repositories", which failed the
      # first v0.2.0 run after the image had already been pushed. Keeping the step and
      # skipping it means it starts working the day the repository is published, rather than
      # being forgotten in a branch.
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

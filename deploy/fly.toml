# Fly.io deployment.
#
#   cp deploy/fly.toml fly.toml     # then edit `app`, and deploy from the repository root
#
# Copy it rather than pointing at it in place: Fly builds from the working directory, so a
# config living in deploy/ would make deploy/ the build context — and the sources are not
# there. With the file at the root, Fly finds the Dockerfile on its own.
#
# Fly is the recommended host for one reason: the EuroDNS API filters by source IP, and a
# dedicated egress IPv4 costs a couple of dollars a month here against roughly $100
# elsewhere. See deploy/README.md for allocating it.

app = 'eurodns-mcp'
primary_region = 'cdg' # Paris. 'ams' and 'fra' are equally close to Luxembourg.

[env]
HOST = '0.0.0.0'
PORT = '3000'
EURODNS_AUDIT_DESTINATION = 'file'
EURODNS_AUDIT_FILE = '/data/audit.jsonl'

# A Fly volume attaches to one machine, so this deployment is single-instance. Scaling out
# means giving up the file-based audit log for a collector — and with it the history query
# tool, which can only read a file.
[mounts]
source = 'eurodns_audit'
destination = '/data'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
interval = '30s'
timeout = '3s'
grace_period = '10s'
method = 'GET'
path = '/healthz'

[[vm]]
size = 'shared-cpu-1x'
memory = '512mb'

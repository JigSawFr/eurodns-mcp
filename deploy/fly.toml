# fly.toml app configuration file generated for eurodns-mcp on 2026-08-31T13:12:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'eurodns-mcp'
primary_region = 'ams'

[build]

[env]
  EURODNS_AUDIT_DESTINATION = 'file'
  EURODNS_AUDIT_FILE = '/data/audit.jsonl'
  HOST = '0.0.0.0'
  PORT = '3000'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
